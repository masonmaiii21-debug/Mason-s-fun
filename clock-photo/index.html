<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Under the Clock</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#e9ddc6}
    body{display:grid;min-height:100svh;place-items:center;padding:clamp(0px,2vw,22px)}
    figure{margin:0;overflow:hidden;background:#f3e7d0;box-shadow:0 18px 60px rgba(46,36,22,.22)}
    a{display:block}
    img{display:block;width:auto;height:auto;max-width:min(100%,760px);max-height:calc(100svh - 44px);object-fit:contain}
    @media(max-width:640px){body{padding:0}figure{width:100%;box-shadow:none}img{width:100%;max-width:none;max-height:none}}
  </style>
</head>
<body>
  <figure>
    <a href="photo.jpg" target="_blank" rel="noreferrer" aria-label="打开原图">
      <img src="photo.jpg" alt="Under the Clock 复古旅行照片">
    </a>
  </figure>
</body>
</html>
